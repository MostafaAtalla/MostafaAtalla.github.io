name: Cancel stuck Pages deployment
on: workflow_dispatch
permissions:
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -w "\nHTTP %{http_code}\n" \
            https://api.github.com/repos/${{ github.repository }}/pages/deployments/3bb73f32de4642d6c08a1fb59ca24239ddc36e43/cancel
